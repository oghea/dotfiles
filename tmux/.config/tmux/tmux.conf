# --- General ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:Tc"
set -g allow-passthrough on
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -s extended-keys on
set -as terminal-features 'xterm-ghostty:extkeys'
bind-key -n S-Enter send-keys Escape "[13;2u"

# --- Prefix ---
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# --- Splits ---
bind d split-window -h -c "#{pane_current_path}"
bind D split-window -v -c "#{pane_current_path}"

# --- Resize panes (vim-style, repeatable) ---
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# --- vim-tmux-navigator ---
# Smart pane switching with awareness of Vim splits.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# --- Pane switching by number (Alt+1..9) ---
bind-key -n M-1 select-pane -t 1
bind-key -n M-2 select-pane -t 2
bind-key -n M-3 select-pane -t 3
bind-key -n M-4 select-pane -t 4
bind-key -n M-5 select-pane -t 5
bind-key -n M-6 select-pane -t 6
bind-key -n M-7 select-pane -t 7
bind-key -n M-8 select-pane -t 8
bind-key -n M-9 select-pane -t 9

# --- Windows ---
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window

# --- Clear screen ---
bind C-l send-keys -R \; clear-history \; send-keys Enter

# --- sesh session picker (prefix + T) ---
# When a session is killed, jump to another one instead of detaching.
set -g detach-on-destroy off
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# --- Copy mode ---
# Clean clipboard on copy: trim trailing padding spaces AND dedent the common
# leading indent so TUIs like Claude Code don't leak message-card padding.
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "~/.dotfiles/scripts/trim-clipboard.sh"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "~/.dotfiles/scripts/trim-clipboard.sh"

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'janoamaral/tokyo-night-tmux'

# Session persistence
set -g @resurrect-processes 'btop lazydocker'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @tokyo-night-tmux_window_id_style digital
set -g @tokyo-night-tmux_pane_id_style dsquare
set -g @tokyo-night-tmux_show_netspeed 1
set -g @tokyo-night-tmux_zoom_id_style dsquare

# --- Reload config ---
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Initialize TPM (auto-install on fresh machines; also self-heals a partial clone)
if "test ! -x ~/.config/tmux/plugins/tpm/tpm" \
   "run 'rm -rf ~/.config/tmux/plugins/tpm && git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"
run '~/.config/tmux/plugins/tpm/tpm'

# --- Pane borders (after TPM to override plugin defaults) ---
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#3b4261"
set -g pane-border-lines heavy
