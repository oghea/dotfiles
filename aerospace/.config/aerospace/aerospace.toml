config-version = 2

start-at-login = true

after-startup-command = ['exec-and-forget /Users/prayogaantarasputra/.config/sketchybar/plugins/aerospace_watcher.sh']

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 0
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 16
outer.bottom = 16
# Reserve space for sketchybar (height 40 + y_offset 2) on external
# monitors; the MacBook screen only gets a small breathing gap.
# Both include an extra 8px to match the other outer gaps.
outer.top = [{ monitor."built-in" = 10 }, 50]
outer.right = 16

[mode.main.binding]

# Cycle windows within the current workspace (project-local alt-tab)
alt-tab = 'focus dfs-next --boundaries workspace --boundaries-action wrap-around-the-workspace'
alt-shift-tab = 'focus dfs-prev --boundaries workspace --boundaries-action wrap-around-the-workspace'

# Fullscreen toggle
cmd-ctrl-f = 'fullscreen'

# Toggle floating/tiling
cmd-ctrl-space = 'layout floating tiling'

# Split direction: horizontal (left/right) or vertical (top/bottom)
cmd-ctrl-slash = 'layout tiles horizontal vertical'

# Toggle split view (tiles) vs stacked-fullscreen (accordion)
cmd-ctrl-a = 'layout tiles accordion'

# Focus windows (vim-style)
cmd-ctrl-h = 'focus left'
cmd-ctrl-j = 'focus down'
cmd-ctrl-k = 'focus up'
cmd-ctrl-l = 'focus right'

# Move windows in direction
cmd-ctrl-shift-h = 'move left'
cmd-ctrl-shift-j = 'move down'
cmd-ctrl-shift-k = 'move up'
cmd-ctrl-shift-l = 'move right'

# Resize
cmd-ctrl-minus = 'resize smart -50'
cmd-ctrl-equal = 'resize smart +50'

# Switch workspace
cmd-ctrl-1 = 'workspace 1'
cmd-ctrl-2 = 'workspace 2'
cmd-ctrl-3 = 'workspace 3'
cmd-ctrl-4 = 'workspace 4'
cmd-ctrl-5 = 'workspace 5'

# Move window to workspace
cmd-ctrl-shift-1 = 'move-node-to-workspace 1'
cmd-ctrl-shift-2 = 'move-node-to-workspace 2'
cmd-ctrl-shift-3 = 'move-node-to-workspace 3'
cmd-ctrl-shift-4 = 'move-node-to-workspace 4'
cmd-ctrl-shift-5 = 'move-node-to-workspace 5'

# Switch to previous workspace
cmd-ctrl-tab = 'workspace-back-and-forth'

# Move workspace to next monitor
cmd-ctrl-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Reset layout
cmd-ctrl-r = 'flatten-workspace-tree'

[[on-window-detected]]
if.app-name-regex-substring = 'Helium'
run = 'layout tiling'
